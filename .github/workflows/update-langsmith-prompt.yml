name: Update LangSmith coaching-chat prompt

on:
  push:
    branches: [main]
    paths: ['.github/scripts/update-coaching-prompt.js']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print prompt but do not push to LangSmith)'
        required: false
        default: 'false'
        type: string

jobs:
  update-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install langsmith
        run: npm install langsmith@0.2.15

      - name: Update coaching-chat prompt
        env:
          LSKEY: bHN2Ml9wdF9mZDgzMjk5M2EwNWQ0MDBjOTE0NzliMjZhOGI2MjA3NF8yY2YzNjgxNDMw
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          export LANGSMITH_API_KEY=$(echo "$LSKEY" | base64 -d)
          node .github/scripts/update-coaching-prompt.js
