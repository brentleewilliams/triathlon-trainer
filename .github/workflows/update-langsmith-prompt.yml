name: Update LangSmith coaching-chat prompt

on:
  workflow_dispatch:
    inputs:
      langsmith_api_key:
        description: 'LangSmith API key (used only for this run, not stored)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (print prompt but do not push to LangSmith)'
        required: false
        default: 'false'
        type: string

jobs:
  update-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install langsmith
        run: npm install langsmith@0.2.15

      - name: Update coaching-chat prompt
        env:
          LANGSMITH_API_KEY: ${{ inputs.langsmith_api_key }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/update-coaching-prompt.js
