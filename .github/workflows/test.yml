name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Write config files
        env:
          ANTHROPICAPIKEY: ${{ secrets.ANTHROPICAPIKEY }}
          OPENAIAPIKEY: ${{ secrets.OPENAIAPIKEY }}
          LANGSMITHAPIKEY: ${{ secrets.LANGSMITHAPIKEY }}
          FIREBASEAPIKEY: ${{ secrets.FIREBASEAPIKEY }}
        run: |
          REPO="$GITHUB_WORKSPACE"

          cat > "$REPO/IronmanTrainer/Config.local.xcconfig" <<EOL
          ANTHROPIC_API_KEY = ${ANTHROPICAPIKEY:-placeholder}
          OPENAI_API_KEY = ${OPENAIAPIKEY:-placeholder}
          LANGSMITH_API_KEY = ${LANGSMITHAPIKEY:-placeholder}
          EOL

          cat > "$REPO/IronmanTrainer/IronmanTrainer/Config.plist" <<EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ANTHROPIC_API_KEY</key>
            <string>${ANTHROPICAPIKEY:-placeholder}</string>
            <key>OPENAI_API_KEY</key>
            <string>${OPENAIAPIKEY:-placeholder}</string>
            <key>LANGSMITH_API_KEY</key>
            <string>${LANGSMITHAPIKEY:-placeholder}</string>
          </dict>
          </plist>
          EOL

          cat > "$REPO/IronmanTrainer/IronmanTrainer/GoogleService-Info.plist" <<EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>${FIREBASEAPIKEY:-placeholder}</string>
            <key>GCM_SENDER_ID</key>
            <string>469784468799</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.brent.ironmantrainer</string>
            <key>PROJECT_ID</key>
            <string>brents-trainer</string>
            <key>STORAGE_BUCKET</key>
            <string>brents-trainer.firebasestorage.app</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:469784468799:ios:ecad30d44b4d7e5670878a</string>
          </dict>
          </plist>
          EOL

      - name: Run tests
        run: |
          xcodebuild test \
            -project IronmanTrainer/Race1\ Trainer.xcodeproj \
            -scheme IronmanTrainer \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults \
            | xcpretty --color --report junit --output test-results.xml \
            || (echo "Tests failed"; exit 1)

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test-results.xml
